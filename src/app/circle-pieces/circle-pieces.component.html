<div [style.background-color]="color" class="circle">

    <div class="wrapbox">
        <app-piece
        class="piece"
        *ngFor="let p of localPieces"
        [id]="p.id"
        [color]="p.color"
        [disabled]="p.disabled"
        [selectedPiece]="selectedPiece"
        [selectedPlayer]="selectedPlayer"
        (pieceSelected)="pieceSelectedPass($event)"
        (playerSelected)="playerSelectedPass($event)"></app-piece>
    </div>
</div>
