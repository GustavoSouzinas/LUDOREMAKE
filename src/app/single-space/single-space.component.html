<div class="space" [style.background-color]="color" >

     <!--Position number-->
     <!-- <div style="position: absolute;">{{number}}</div>
     <div style="position: absolute;">{{finalNumber}}</div> -->
     <!--Arrow icon-->
     <div class="container" style="position: absolute;" *ngIf="showArrow" >
          <img src="assets/Right_simple_arrow_-_black.svg" 
          style="transform: rotate(90deg);"
          alt="Arrow"
          width="45"
          height="45">
     </div>

     <!--Star icon-->
     <div class="container" style="position: absolute;" *ngIf="showStar">
          <img src="assets/Five_Pointed_Star_Solid.svg"
          style="transform: rotate(0deg);"
          alt="Star"
          width="50"
          height="50">
     </div>

     <!--Piece-->
     <div class="container-wrap">
          <app-piece class="item" *ngFor="let p of local_pieces" 
          (pieceSelected)="sp_piece_selected_pass($event)" 
          [color]="p.color" 
          [currentPos]="p.currentPos"
          [id]="p.id"
          [disabled]="p.disabled"
          [selectedPiece]="selectedPiece"
          [selectedPlayer]="selectedPlayer"
          [class.grow]="canGrow"
          [style.min-width.px]="minWidth"
          animate.enter="enter-piece"
          animate.leave="leave-piece">
          </app-piece>
     </div>

</div>
